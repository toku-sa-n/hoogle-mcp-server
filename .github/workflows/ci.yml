name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Set up Haskell
              uses: haskell/actions/setup@96f3dafd067155f32643c2a0757ab71d2910e2c2 # v2.8.0
              with:
                  ghc-version: "9.4.7"
                  cabal-version: "3.10.1.0"

            - name: Cache Haskell packages
              uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
              with:
                  path: |
                      ~/.cabal
                      ~/.ghc
                  key: ${{ runner.os }}-haskell-${{ hashFiles('**/*.cabal') }}
                  restore-keys: |
                      ${{ runner.os }}-haskell-

            - name: Install Hoogle
              run: |
                  cabal update
                  cabal install hoogle --install-method=copy
                  echo "$HOME/.cabal/bin" >> $GITHUB_PATH

            - name: Cache Python packages
              uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-${{ matrix.python-version }}-

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install hatch
                  hatch env create

            - name: Generate Hoogle database
              run: |
                  hoogle generate

            - name: Run type checking
              run: hatch run type-check:run

            - name: Run tests
              run: hatch test

            - name: Test package installation
              run: |
                  pip install .
                  python -c "import hoogle_mcp_server"

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Set up Python
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: python -m pip install --upgrade pip

            - name: Run lint
              run: hatch run lint:run

    type-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Set up Python
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: python -m pip install --upgrade pip

            - name: Run type checking
              run: hatch run type-check:run

    format-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Set up Node.js
              uses: actions/setup-node@bea5baf987ba7aa777a8a0d4ace377a21c45c381 # v4.1.0
              with:
                  node-version: "20"

            - name: Install Prettier
              run: |
                  npm install -g prettier

            - name: Check format with Prettier
              run: |
                  prettier --check .

    security:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Set up Python
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
              with:
                  python-version: "3.13"

            - name: Install dependencies
              run: python -m pip install --upgrade pip

            - name: Run security checks
              run: hatch run security:run
