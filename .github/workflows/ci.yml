name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Hatch
        run: pip install hatch

      - name: Set up Haskell
        id: setup-haskell
        uses: haskell-actions/setup@96f3dafd067155f32643c2a0757ab71d2910e2c2 # v2.8.0
        with:
          ghc-version: "9.4.7"
          cabal-version: "3.10.1.0"

      - name: Cache Haskell packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ steps.setup-haskell.outputs.cabal-store }}
            ${{ steps.setup-haskell.outputs.ghc-path }}
          key: ${{ runner.os }}-haskell-ghc-${{ steps.setup-haskell.outputs.ghc-version }}-cabal-${{ steps.setup-haskell.outputs.cabal-version }}
          restore-keys: |
            ${{ runner.os }}-haskell-ghc-${{ steps.setup-haskell.outputs.ghc-version }}-
            ${{ runner.os }}-haskell-

      - name: Install Hoogle
        run: |
          cabal update
          cabal install hoogle --install-method=copy
          echo "$HOME/.cabal/bin" >> $GITHUB_PATH

      - name: Get Hoogle version
        id: hoogle-version
        run: echo "version=$(hoogle --numeric-version)" >> $GITHUB_OUTPUT

      - name: Cache Hoogle database
        id: cache-hoogle-db
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.hoogle
          key: ${{ runner.os }}-hoogle-db-ghc-${{ steps.setup-haskell.outputs.ghc-version }}-${{ steps.hoogle-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-hoogle-db-ghc-${{ steps.setup-haskell.outputs.ghc-version }}-
            ${{ runner.os }}-hoogle-db-

      - name: Generate Hoogle database
        if: steps.cache-hoogle-db.outputs.cache-hit != 'true'
        run: hoogle generate

      - name: Run tests
        run: hatch test --all

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Hatch
        run: pip install hatch

      - name: Run type checking
        run: hatch run type-check:run --all

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Hatch
        run: pip install hatch

      - name: Check style
        run: hatch run style:check

  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install Prettier
        run: npm install -g prettier

      - name: Check style with Prettier
        run: prettier --check .

  markdown-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: DavidAnson/markdownlint-cli2-action@05f32210e84442804257b2a6f20b273450ec8265 # v19.1.0

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Hatch
        run: pip install hatch

      - name: Run security checks
        run: hatch run security:run
