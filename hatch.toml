[envs.format]
detached = true
dependencies = ["black", "isort", "flake8", "flake8-bugbear"]

[envs.format.scripts]
run = ["black --check .", "isort --profile black --check-only .", "flake8 ."]

[envs.type-check]
detached = true
dependencies = [
    "mypy",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "pytest >= 8.0",
    "pytest-asyncio >= 1.0.0",
]

[[envs.type-check.matrix]]
python = ["3.10", "3.11", "3.12", "3.13"]

[envs.type-check.scripts]
run = "mypy ."

[envs.security]
detached = true
dependencies = ["pip-audit", "bandit"]

[envs.security.scripts]
# Bandit's `exclude` option does not seem to work: https://github.com/PyCQA/bandit/issues/693
run = ["pip-audit", "bandit -c bandit.yaml -r ."]

[envs.hatch-test]
extra-dependencies = ["pytest >= 8.0", "pytest-asyncio >= 1.0.0"]

[[envs.hatch-test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13"]
