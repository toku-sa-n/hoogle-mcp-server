[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hoogle-mcp-server"
version = "0.1.0"
description = "MCP server for accessing Hoogle search functionality"
authors = [{ name = "toku-sa-n", email = "tokusan441@gmail.com" }]
license = { text = "AGPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.8"
keywords = ["mcp", "hoogle", "haskell"]
dependencies = ["mcp>=1.0.0", "pydantic>=2.0.0"]

[project.urls]
Homepage = "https://github.com/toku-sa-n/hoogle-mcp-server"
Repository = "https://github.com/toku-sa-n/hoogle-mcp-server"

[project.scripts]
hoogle-mcp-server = "hoogle_mcp_server.server:cli_main"

[tool.hatch.build.targets.wheel]
packages = ["src/hoogle_mcp_server"]

[tool.hatch.envs.default]
dependencies = ["mypy"]

[tool.hatch.envs.hatch-test]
extra-dependencies = ["pytest >= 8.0", "pytest-asyncio >= 1.0.0"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
